name: Echelon application foundations

on:
  workflow_call:
    inputs:
      praxis_ref:
        description: Immutable Praxis commit containing the verifier implementation.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-foundations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application repository
        uses: actions/checkout@v6
        with:
          path: application

      - name: Check out pinned Praxis verifier
        uses: actions/checkout@v6
        with:
          repository: kemiller2002/praxis
          ref: ${{ inputs.praxis_ref }}
          path: praxis-verifier

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The CLI project was src/Ros.Cli/Ros.Cli.fsproj before the internal
      # namespace rename (PRAXIS-INTERNAL-NAMESPACES); a caller may pin a
      # commit from either side.
      - name: Build pinned Praxis verifier
        shell: bash
        run: |
          set -euo pipefail
          project=praxis-verifier/src/Praxis.Cli/Praxis.Cli.fsproj
          [ -f "$project" ] || project=praxis-verifier/src/Ros.Cli/Ros.Cli.fsproj
          dotnet build "$project" --configuration Release
          echo "PRAXIS_VERIFIER_BIN=$(dirname "$project")/bin/Release/net10.0" >> "$GITHUB_ENV"

      - name: Verify declared Echelon application foundations
        id: foundations
        shell: bash
        run: |
          set +e
          # The CLI assembly was ros-fs.dll before the Praxis rename
          # (DF-ROS-2026-A050); a caller may pin a commit from either side.
          cli="$PRAXIS_VERIFIER_BIN/praxis.dll"
          [ -f "$cli" ] || cli="$PRAXIS_VERIFIER_BIN/ros-fs.dll"
          dotnet "$cli" \
            --root "$GITHUB_WORKSPACE/application" \
            foundations verify --json > "$RUNNER_TEMP/echelon-foundations.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/echelon-foundations.json"
          cp "$RUNNER_TEMP/echelon-foundations.json" "$GITHUB_WORKSPACE/echelon-foundations.json"
          exit "$code"

      - name: Preserve foundation verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echelon-foundations
          path: echelon-foundations.json
          if-no-files-found: error
          retention-days: 30

name: WI-0062 ROS completion

on:
  push:
    branches:
      - work/wi-0062-structural-review

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[wi0062-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build authoritative ROS CLI
        run: npm run build:fsharp
      - name: Complete WI-0062
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./ros work complete --id WI-0062 --occurred-at "$NOW"             --evidence implementation=research/decisions/DF-ROS-2026-A035--govern-sde-structural-locality-warnings-as-review-obligations.md             --evidence implementation=docs/upgrades/SDE-1.3.0-STRUCTURAL-TRIAGE.md             --evidence tests=docs/upgrades/SDE-1.3.0-STRICT-CURRENT.json             --evidence tests=.github/workflows/ros-validation.yml
          ./ros registry check
          ./ros validate
      - name: Commit governed completion and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wi0062-complete.yml
          git add .ros registries
          git add -u .github/workflows
          git commit -m "chore: complete WI-0062 under ROS [wi0062-complete]"
          git push

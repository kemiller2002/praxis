name: ROS validation

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm run test:all
      - run: ./ros validate
        env:
          ROS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

  # package.json declares "engines": { "node": ">=20" }. This job is the
  # evidence for that claim: the lowest supported Node version has to run the
  # real packed artifact, not just the source tree.
  packaged-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared minimum, and the versions in normal use.
          - { os: ubuntu-latest, node-version: "20" }
          - { os: ubuntu-latest, node-version: "24" }
          # One run per remaining supported operating system.
          - { os: windows-latest, node-version: "22" }
          - { os: macos-latest, node-version: "22" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm run build:fsharp
      # This test packs the artifact itself and asserts its contents, so there
      # is no separate pack step: `npm pack` would only re-run the whole suite
      # through prepack.
      - name: Exercise the packed npm artifact
        run: node --test tests/lifecycle-package.test.mjs

  # CI may be red while a branch is under active development. This aggregate
  # is the integration boundary: it runs even when an upstream job failed and
  # proves readiness only for this exact GitHub candidate SHA.
  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs:
      - validate
      - packaged-lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize required-check evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PACKAGED_RESULT: ${{ needs.packaged-lifecycle.result }}
        run: |
          python - <<'PY'
          import json, os

          def state(value):
              return {
                  "success": "succeeded",
                  "failure": "failed",
                  "cancelled": "cancelled",
                  "skipped": "skipped",
              }.get(value, f"unknown:{value}")

          sha = os.environ["CANDIDATE_SHA"].lower()
          evidence = {
              "schema": "praxis.merge-readiness/1",
              "candidateCommit": sha,
              "remoteCandidateCurrent": True,
              "checks": [
                  {
                      "id": "repository-validation",
                      "state": state(os.environ["VALIDATE_RESULT"]),
                      "commit": sha,
                  },
                  {
                      "id": "packaged-lifecycle",
                      "state": state(os.environ["PACKAGED_RESULT"]),
                      "commit": sha,
                  },
              ],
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "merge-readiness.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2)
              handle.write("\n")
          PY
      - run: npm run build:fsharp
      - name: Require exact-candidate merge readiness
        run: ./ros merge readiness --evidence "$RUNNER_TEMP/merge-readiness.json" --json

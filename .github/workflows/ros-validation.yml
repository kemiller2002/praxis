name: ROS validation

on:
  pull_request:
  push:
    branches-ignore:
      - "praxis-inbox/**"

concurrency:
  group: ros-validation-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for commit batch
        run: sleep 600

  validate:
    needs: debounce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm run test:all
      - run: ./ros validate
        env:
          ROS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

  # package.json declares "engines": { "node": ">=20" }. This job is the
  # evidence for that claim: the lowest supported Node version has to run the
  # real packed artifact, not just the source tree.
  packaged-lifecycle:
    needs: debounce
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared minimum, and the versions in normal use.
          - { os: ubuntu-latest, node-version: "20" }
          - { os: ubuntu-latest, node-version: "24" }
          # One run per remaining supported operating system.
          - { os: windows-latest, node-version: "22" }
          - { os: macos-latest, node-version: "22" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: npm run build:fsharp
      # This test packs the artifact itself and asserts its contents, so there
      # is no separate pack step: `npm pack` would only re-run the whole suite
      # through prepack.
      - name: Exercise the packed npm artifact
        run: node --test tests/lifecycle-package.test.mjs

name: WI-0062 ROS bootstrap

on:
  push:
    branches:
      - work/wi-0062-structural-review

permissions:
  contents: write

jobs:
  start:
    if: ${{ !contains(github.event.head_commit.message, '[wi0062-started]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build authoritative F# ROS CLI
        run: npm run build:fsharp
      - name: Start WI-0062 through ROS
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./ros work backlog-transition --action ready --id WI-0062 --occurred-at "$NOW"
          ./ros work start --id WI-0062 --occurred-at "$NOW" --type maintenance --actor ChatGPT
          ./ros work context WI-0062
      - name: Commit ROS state and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wi0062-bootstrap.yml
          git add .ros/context/current.json .ros/events/events.jsonl .ros/work/queue.json .ros/work/queue.md .ros/telemetry/executions
          git commit -m "chore: start WI-0062 under ROS [wi0062-started]"
          git push

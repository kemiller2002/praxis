name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kemiller2002/repository-operating-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Use an npm CLI with trusted-publishing support
        run: |
          npm install --global npm@11
          npm --version

      - name: Require an explicit public license
        run: |
          node -e "const p=require('./package.json'); if (!p.license || p.license === 'UNLICENSED') { console.error('Select and commit a public license before publishing.'); process.exit(1); }"

      - name: Test and validate
        run: |
          npm run test:all
          ./ros registry check
          ./ros validate
        env:
          ROS_BASE_REF: ${{ github.event.before }}

      # A stable "latest" release happens only when this push actually
      # changed package.json's committed version -- publishing on every push
      # would make every commit a public release and empty the version
      # number of meaning. This step must run before the snapshot step
      # below, which rewrites package.json's version in the runner's
      # working copy (not the repository) for its own, unrelated publish.
      - name: Determine whether package.json's version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          CHANGED=false
          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            if git show "${{ github.event.before }}:package.json" > /tmp/previous-package.json 2>/dev/null; then
              PREVIOUS_VERSION=$(node -p "require('/tmp/previous-package.json').version" 2>/dev/null || echo "")
              if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "$CURRENT_VERSION" ]; then
                CHANGED=true
              fi
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on the registry
        id: registry-check
        if: steps.version-check.outputs.changed == 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if npm view "${PACKAGE_NAME}@${{ steps.version-check.outputs.current }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish stable release
        if: steps.version-check.outputs.changed == 'true' && steps.registry-check.outputs.already_published == 'false'
        run: npm publish --access public

      - name: Report stable release
        if: steps.version-check.outputs.changed == 'true' && steps.registry-check.outputs.already_published == 'false'
        run: echo "Published @echelon-foundry/repository-operating-system@${{ steps.version-check.outputs.current }} with dist-tag latest"

      # ros-fs (bin/ros-fs.mjs) fetches a self-contained single-file binary
      # for the caller's platform from this tagged release on first use and
      # caches it; see DF-ROS-2026-A029. Built here, once, on a stable
      # version bump only -- main-snapshot versions have no matching release
      # and the launcher falls back to erroring with a clear message.
      - name: Build self-contained ros-fs binaries for release
        if: steps.version-check.outputs.changed == 'true' && steps.registry-check.outputs.already_published == 'false'
        run: |
          set -euo pipefail
          mkdir -p dist/ros-fs
          dotnet publish src/Ros.Cli/Ros.Cli.fsproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/publish/linux-x64
          cp dist/publish/linux-x64/ros-fs dist/ros-fs/ros-fs-linux-x64
          dotnet publish src/Ros.Cli/Ros.Cli.fsproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/publish/linux-arm64
          cp dist/publish/linux-arm64/ros-fs dist/ros-fs/ros-fs-linux-arm64
          dotnet publish src/Ros.Cli/Ros.Cli.fsproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/publish/osx-x64
          cp dist/publish/osx-x64/ros-fs dist/ros-fs/ros-fs-osx-x64
          dotnet publish src/Ros.Cli/Ros.Cli.fsproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/publish/osx-arm64
          cp dist/publish/osx-arm64/ros-fs dist/ros-fs/ros-fs-osx-arm64
          dotnet publish src/Ros.Cli/Ros.Cli.fsproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/publish/win-x64
          cp dist/publish/win-x64/ros-fs.exe dist/ros-fs/ros-fs-win-x64.exe
          cd dist/ros-fs
          sha256sum ros-fs-linux-x64 ros-fs-linux-arm64 ros-fs-osx-x64 ros-fs-osx-arm64 ros-fs-win-x64.exe > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release with ros-fs binaries
        if: steps.version-check.outputs.changed == 'true' && steps.registry-check.outputs.already_published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version-check.outputs.current }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release v${VERSION} already exists; skipping"
          else
            gh release create "v${VERSION}" \
              dist/ros-fs/ros-fs-linux-x64 \
              dist/ros-fs/ros-fs-linux-arm64 \
              dist/ros-fs/ros-fs-osx-x64 \
              dist/ros-fs/ros-fs-osx-arm64 \
              dist/ros-fs/ros-fs-win-x64.exe \
              dist/ros-fs/checksums.txt \
              --title "v${VERSION}" \
              --notes "ros-fs self-contained binaries for @echelon-foundry/repository-operating-system@${VERSION}. Fetched automatically by the npm package's ros-fs launcher (bin/ros-fs.mjs) on first use; not intended for direct manual download."
          fi

      - name: Create unique main-snapshot version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PUBLISH_VERSION="${BASE_VERSION}-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          npm version "$PUBLISH_VERSION" --no-git-tag-version
          echo "version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish main snapshot
        run: npm publish --access public --tag main

      - name: Report published snapshot
        run: echo "Published @echelon-foundry/repository-operating-system@${{ steps.version.outputs.version }} with dist-tag main"

name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kemiller2002/repository-operating-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Use an npm CLI with trusted-publishing support
        run: |
          npm install --global npm@11
          npm --version

      - name: Require an explicit public license
        run: |
          node -e "const p=require('./package.json'); if (!p.license || p.license === 'UNLICENSED') { console.error('Select and commit a public license before publishing.'); process.exit(1); }"

      - name: Test and validate
        run: |
          npm run test:all
          ./ros registry check
          ./ros validate
        env:
          ROS_BASE_REF: ${{ github.event.before }}

      # A stable "latest" release happens only when this push actually
      # changed package.json's committed version -- publishing on every push
      # would make every commit a public release and empty the version
      # number of meaning. This step must run before the snapshot step
      # below, which rewrites package.json's version in the runner's
      # working copy (not the repository) for its own, unrelated publish.
      - name: Determine whether package.json's version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          CHANGED=false
          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            if git show "${{ github.event.before }}:package.json" > /tmp/previous-package.json 2>/dev/null; then
              PREVIOUS_VERSION=$(node -p "require('/tmp/previous-package.json').version" 2>/dev/null || echo "")
              if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "$CURRENT_VERSION" ]; then
                CHANGED=true
              fi
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on the registry
        id: registry-check
        if: steps.version-check.outputs.changed == 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if npm view "${PACKAGE_NAME}@${{ steps.version-check.outputs.current }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish stable release
        if: steps.version-check.outputs.changed == 'true' && steps.registry-check.outputs.already_published == 'false'
        run: npm publish --access public

      - name: Report stable release
        if: steps.version-check.outputs.changed == 'true' && steps.registry-check.outputs.already_published == 'false'
        run: echo "Published @echelon-foundry/repository-operating-system@${{ steps.version-check.outputs.current }} with dist-tag latest"

      - name: Create unique main-snapshot version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PUBLISH_VERSION="${BASE_VERSION}-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          npm version "$PUBLISH_VERSION" --no-git-tag-version
          echo "version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish main snapshot
        run: npm publish --access public --tag main

      - name: Report published snapshot
        run: echo "Published @echelon-foundry/repository-operating-system@${{ steps.version.outputs.version }} with dist-tag main"

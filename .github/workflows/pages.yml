name: Documentation site

# Builds README.md, the root guides, docs/, and the canonical research and
# requirement records into static HTML (scripts/build-pages-site.mjs) and
# publishes it to GitHub Pages. Pull requests build and test the site as a
# check; only main deploys. Requires Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build-pages-site.mjs"
      - "tests/pages-*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "*.md"
      - "docs/**"
      - "research/**"
      - "requirements/**"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build-pages-site.mjs"
      - "tests/pages-*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "*.md"
      - "docs/**"
      - "research/**"
      - "requirements/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Test the site builder
        run: node --test tests/pages-site.test.mjs tests/pages-render.test.mjs

      - name: Build static HTML
        run: node scripts/build-pages-site.mjs _site --repository "${{ github.repository }}" --ref "${{ github.sha }}"

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Documentation site

# Publishes README.md, the root guides, docs/, and the canonical research and
# requirement records to GitHub Pages. Pull requests build the site as a check;
# only main deploys. Requires Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build-pages-site.mjs"
      - "*.md"
      - "LICENSE"
      - "docs/**"
      - "research/**"
      - "requirements/**"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build-pages-site.mjs"
      - "*.md"
      - "LICENSE"
      - "docs/**"
      - "research/**"
      - "requirements/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Stage documentation
        run: >
          node scripts/build-pages-site.mjs _pages
          --repository "${{ github.repository }}"
          --ref "${{ github.sha }}"
          --baseurl "${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}"

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages
          destination: ./_site

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: WI-0063 ROS completion

on:
  push:
    branches:
      - work/gh-63-ordo-observation-next-pass

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[wi0063-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build authoritative ROS CLI
        run: npm run build:fsharp
      - name: Complete WI-0063
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./ros work complete --id WI-0063 --occurred-at "$NOW" \
            --evidence implementation=src/Ros.Domain/Ordo/Model.fs \
            --evidence implementation=src/Ros.Contracts/Ordo/ObservationJson.fs \
            --evidence implementation=src/Ros.Application/Ordo/Operations.fs \
            --evidence implementation=src/Ros.Infrastructure/Ordo/FileObservationRepository.fs \
            --evidence tests=tests/Ros.Tests/OrdoObservationTests.fs \
            --evidence tests=tests/work-start-fsharp-differential.test.mjs
          ./ros registry build
          ./ros registry check
          ./ros validate
      - name: Commit governed completion and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wi0063-complete.yml
          git add .ros registries
          git commit -m "chore: complete WI-0063 under ROS [wi0063-complete]"
          git push

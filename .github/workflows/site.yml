name: Public site

# Checks the static public site (site/) and assembles the artifact that
# deploy-pages.yml deploys. Independent of the native release workflow.
# Needs the .NET SDK only: the site tooling (site-tools/SiteTools.fsproj) is
# F# with no package dependencies.

on:
  pull_request:
    paths:
      - "site/**"
      - "site-tools/**"
      - "tests/Site.Tests/**"
      - "docs/public-site.md"
      - "docs/site/**"
      - ".ros/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-tools/**"
      - "tests/Site.Tests/**"
      - "docs/public-site.md"
      - "docs/site/**"
      - ".ros/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The case-study tests compare the page's claims with Git history.
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Structure, references, accessibility rules, boundary, evidence, tests
        run: dotnet run --project site-tools/SiteTools.fsproj -c Release -- verify
      - name: Assemble and re-check the static artifact
        run: dotnet run --project site-tools/SiteTools.fsproj -c Release -- assemble _site
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: _site
          if-no-files-found: error
          retention-days: 14

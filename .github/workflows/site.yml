name: Public site

# Checks the static public site (site/) and assembles the artifact that
# deploy-pages.yml deploys. Independent of the npm and native release workflows.
# Needs Node only: the site has no dependencies to install.

on:
  pull_request:
    paths:
      - "site/**"
      - "site-tools/**"
      - "tests/site/**"
      - "docs/public-site.md"
      - "docs/site/**"
      - ".ros/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-tools/**"
      - "tests/site/**"
      - "docs/public-site.md"
      - "docs/site/**"
      - ".ros/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for commit batch
        run: sleep 600
      - uses: actions/checkout@v4
        with:
          # The case-study tests compare the page's claims with Git history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Structure, references, accessibility rules, boundary, evidence, tests
        run: node site-tools/verify.mjs
      - name: Assemble and re-check the static artifact
        run: node site-tools/assemble.mjs _site
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: _site
          if-no-files-found: error
          retention-days: 14

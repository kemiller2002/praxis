name: WI-0061 SDE 1.3.0 upgrade

on:
  push:
    branches:
      - work/wi-0061-sde-1.3.0-upgrade

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[wi0061-upgraded]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build ROS F# CLI
        run: npm run build:fsharp

      - name: Begin ROS work item
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./ros work start --id WI-0061 --occurred-at "$NOW" --type maintenance --actor ChatGPT
          ./ros work context WI-0061

      - name: Prove the SDE dry run is non-mutating
        run: |
          npx --yes @echelon-foundry/sde@1.3.0 upgrade --dry-run --json | tee /tmp/sde-upgrade-plan.json
          git diff --exit-code -- .sde .echelon
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('/tmp/sde-upgrade-plan.json', 'utf8'));
          if (plan.command !== 'upgrade' || plan.dryRun !== true) {
            throw new Error('expected an upgrade dry-run plan');
          }
          if (!Array.isArray(plan.changes) || plan.changes.length === 0) {
            throw new Error('expected the 1.1.1 installation to require changes');
          }
          NODE

      - name: Upgrade SDE to 1.3.0
        run: |
          npx --yes @echelon-foundry/sde@1.3.0 upgrade
          npx --yes @echelon-foundry/sde@1.3.0 verify
          test "$(tr -d '\r\n' < .sde/VERSION)" = "1.3.0"
          test -f .sde/architecture/DECISION-AND-EVIDENCE-SEMANTICS.md
          node - <<'NODE'
          const fs = require('fs');
          const record = JSON.parse(fs.readFileSync('.echelon/sde.json', 'utf8'));
          if (record.installedVersion !== '1.3.0') throw new Error('installation record is not 1.3.0');
          if (record.configurationVersion !== 2) throw new Error('expected configuration version 2');
          NODE

      - name: Record strict structural-review obligations without weakening SDE
        run: |
          set +e
          npx --yes @echelon-foundry/sde@1.3.0 verify --strict --json > /tmp/sde-strict.json
          STRICT_EXIT=$?
          set -e
          export STRICT_EXIT
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/sde-strict.json', 'utf8'));
          const exitCode = Number(process.env.STRICT_EXIT);
          if (report.installedVersion !== '1.3.0') throw new Error('strict report is not for SDE 1.3.0');
          if (!Array.isArray(report.problems) || report.problems.length !== 0) {
            throw new Error('upgrade has installation-integrity problems; refusing to continue');
          }
          if (!report.structural || report.structural.ran !== true || report.structural.error !== null) {
            throw new Error('structural review did not run cleanly');
          }
          const findings = report.structural.findings ?? [];
          const strictFailures = report.strictFailures ?? [];
          if (findings.length === 0) {
            if (exitCode !== 0 || report.passed !== true) throw new Error('strict verification failed without structural findings');
          } else {
            if (exitCode === 0) throw new Error('strict verification unexpectedly succeeded despite structural findings');
            if (strictFailures.length === 0 || strictFailures.some(x => !x.includes('SDE-STRUCT-001'))) {
              throw new Error('strict verification contains a non-structural failure');
            }
          }

          const rows = findings.map(f => `- ${f.code} [${f.band}] \`${f.path}\`: ${f.lineCount} physical lines`);
          const md = [
            '# SDE 1.3.0 structural review obligations',
            '',
            'Generated during WI-0061 while upgrading ROS from SDE 1.1.1 to 1.3.0.',
            '',
            'The SDE installation itself verifies cleanly. Strict verification reports the review signals below.',
            'They are recorded as follow-up work rather than hidden by changing SDE thresholds.',
            '',
            `Finding count: **${findings.length}**`,
            '',
            ...rows,
            '',
            'Each finding must be triaged under the installed SDE structural-locality rules. A finding may result in refactoring or an explicit justified exception; line count alone is not proof of semantic nonconformance.',
            ''
          ].join('\n');
          fs.mkdirSync('docs/upgrades', { recursive: true });
          fs.writeFileSync('docs/upgrades/SDE-1.3.0-STRUCTURAL-REVIEW.md', md);
          NODE
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./ros work capture --id WI-0062 --title "Triage SDE 1.3.0 structural review findings" --occurred-at "$NOW" --priority high --description "Review the SDE 1.3.0 structural findings recorded in docs/upgrades/SDE-1.3.0-STRUCTURAL-REVIEW.md. Preserve SDE thresholds; justify or refactor each finding rather than suppressing the gate." --tag sde --tag structural-review

      - name: Validate ROS after the methodology upgrade
        run: |
          ./ros registry build
          ./ros registry check
          ./ros validate

      - name: Commit upgrade and ROS-generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wi0061-sde-upgrade.yml
          git add -A .sde .echelon .ros registries docs/upgrades .github/workflows/wi0061-sde-upgrade.yml
          git commit -m "chore: upgrade SDE to 1.3.0 under ROS [wi0061-upgraded]"
          git push

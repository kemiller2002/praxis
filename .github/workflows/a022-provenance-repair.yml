name: A022 provenance repair

on:
  push:
    branches:
      - research/a022-affinity-falsification
    paths:
      - '.github/workflows/a022-provenance-repair.yml'

permissions:
  contents: write

concurrency:
  group: a022-provenance-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRAXIS_ACTOR_KIND: agent
      PRAXIS_ACTOR: openai/chatgpt
      PRAXIS_TELEMETRY_PROVIDER: openai
      PRAXIS_TELEMETRY_MODEL: gpt-5.6-sol
      PRAXIS_TELEMETRY_RUNTIME: chatgpt
      A022_BASE: ede651f694f969b115196408df718384232480ec
      WORK_ITEM: PRAXIS-PLAN-EXP-02
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/a022-affinity-falsification

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build current source Praxis
        run: dotnet build Praxis.slnx --configuration Release

      - name: Establish work, reconcile prior commits, and record provenance
        shell: bash
        run: |
          set -euo pipefail
          now() { date -u +%Y-%m-%dT%H:%M:%S.000Z; }

          ./praxis add "Preserve A021 R2 replication and pre-register the affinity falsification experiment"             --id "$WORK_ITEM" --tag planning,experiment --priority medium
          ./praxis work backlog-transition --action ready --id "$WORK_ITEM" --occurred-at "$(now)"
          ./praxis work start --id "$WORK_ITEM" --occurred-at "$(now)" --type research

          REPAIR_HEAD="$(git rev-parse HEAD)"
          ./praxis work reconcile --id "$WORK_ITEM"             --reason "ChatGPT committed the R2 integration and A022 pre-registration before the pinned remote runtime could establish work; the remote executor rejected an existing abandoned semantic state, so Git-backed attribution is being recovered with the current source Praxis."             --range "$A022_BASE..$REPAIR_HEAD" --occurred-at "$(now)"

          ./praxis provenance record             --path research/evidence/EV-ROS-2026-A070--a021-r2-blind-evaluation-and-replication.md             --operation created             --reason "Created by OpenAI ChatGPT during the R2 integration; the source-Praxis execution was established after the pinned remote runtime failed, with the preceding commits reconciled post-hoc."             --derived-from EX-ROS-2026-A021             --occurred-at "$(now)"

          ./praxis provenance record             --path research/hypotheses/HY-ROS-2026-A028--grouped-execution-value.md             --operation modified             --reason "Updated the grouping hypothesis with the R2 replication evidence and the next falsification test."             --evidence EV-ROS-2026-A070             --occurred-at "$(now)"

          ./praxis provenance record             --path research/hypotheses/HY-ROS-2026-A029--affinity-moderates-grouping-value.md             --operation created             --reason "Created the affinity-moderation hypothesis that distinguishes cohesion effects from generic session setup-cost amortization."             --evidence EV-ROS-2026-A070             --occurred-at "$(now)"

          ./praxis provenance record             --path research/experiments/EX-ROS-2026-A022--affinity-by-execution-mode.md             --operation created             --reason "Created the pre-registered 2x2 high/low-affinity by grouped/independent falsification experiment."             --evidence EV-ROS-2026-A070             --occurred-at "$(now)"

          ./praxis registry build

      - name: Commit and push attributed research state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI ChatGPT"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/a022-provenance-repair.yml
          git add -A
          git commit -m "praxis: reconcile A022 research and record provenance"
          git push origin HEAD:research/a022-affinity-falsification

      - name: Checkpoint, complete, and validate the work
        shell: bash
        run: |
          set -euo pipefail
          now() { date -u +%Y-%m-%dT%H:%M:%S.000Z; }

          ./praxis work checkpoint --id "$WORK_ITEM" --occurred-at "$(now)"             --summary "Preserved the R2 blind bundle as EV-ROS-2026-A070 and pre-registered HY-ROS-2026-A029 / EX-ROS-2026-A022 with source-Praxis provenance."             --next-action "Land PR 145 after CI is green."

          ./praxis work complete --id "$WORK_ITEM" --occurred-at "$(now)"             --evidence research-record=research/experiments/EX-ROS-2026-A022--affinity-by-execution-mode.md             --conclusion inconclusive

          ./praxis registry build
          ./praxis validate

          git add -A
          git commit -m "praxis: complete PRAXIS-PLAN-EXP-02"
          git push origin HEAD:research/a022-affinity-falsification

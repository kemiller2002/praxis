name: Deploy Site

# Mirrors kemiller2002/echelon-foundry .github/workflows/deploy-pages.yml.
# The Praxis site has no build step of its own: "Build site" runs the site
# checks and assembles site/ into dist/ with the F# site tooling
# (site-tools/SiteTools.fsproj), which lives outside every path
# native-release.yml watches on main. See docs/site/site-deployment.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The case-study tests compare the page's claims with Git history.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build site
        run: dotnet run --project site-tools/SiteTools.fsproj -c Release -- verify && dotnet run --project site-tools/SiteTools.fsproj -c Release -- assemble dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

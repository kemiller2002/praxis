name: ROS validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ./ros installs and runs the Praxis version this project pins; it
      # needs only a POSIX shell and curl (no Node.js, npm or .NET).
      - run: ./ros registry check
      - run: ./ros validate
        env:
          ROS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
